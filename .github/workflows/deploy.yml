name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — personal token from vercel.com/account/tokens
#   VERCEL_ORG_ID      — from `vercel link` or the project's .vercel/project.json
#   VERCEL_PROJECT_ID  — same source as above
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip when the deploy secrets aren't configured yet, so the workflow
    # doesn't fail red before the repo is linked to Vercel.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard on Vercel secrets
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repo secrets to enable Vercel deploys."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.guard.outputs.has_secrets == 'true'
        run: npm install -g vercel@latest

      - name: Determine environment
        if: steps.guard.outputs.has_secrets == 'true'
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        if: steps.guard.outputs.has_secrets == 'true'
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.guard.outputs.has_secrets == 'true'
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy
        if: steps.guard.outputs.has_secrets == 'true'
        id: deploy
        run: |
          if [ "${{ steps.env.outputs.target }}" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Vercel ($env_target)" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          env_target: ${{ steps.env.outputs.target }}
